[project]
name = "everflow-experience-site"
version = "0"
description = "The website of EverFlow Experience: content/*.json and scripts/build.py give _site/, served by GitHub Pages"
requires-python = ">=3.12"

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["_site", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # the HTML templates in build.py are long lines on purpose
